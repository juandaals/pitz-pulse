[project]
name = "pitz-pulse"
version = "0.1.0"
description = "Internal request triage service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-anthropic>=1.7,<2",
    "anthropic>=1.8,<2",
    "claude-agent-sdk>=0.2.160,<0.3",
    "langsmith>=0.14.1,<0.15",  # tracing_context: classify never traces (D14)
    "anyio>=4.15,<5",  # runs the Agent SDK's async query from a worker thread
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "httpx>=0.28.1,<0.29",  # tests build real anthropic errors and responses
    "httpx2>=2.13.1,<3",  # offline MockTransport for the Anthropic wire test
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitz_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
