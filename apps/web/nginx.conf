# Serves the built SPA and proxies /api/ to the API service (Spec 05 §2, D22): the browser only
# ever talks to this one origin, so the API needs no CORS.
server {
    listen 80;

    # Matches the API's own body-size guard (Spec 02 §4, MAX_BODY_BYTES) so an oversized request
    # is rejected here instead of streaming all the way to the API.
    client_max_body_size 64k;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
    }

    # SPA fallback: there is no router (Spec 05 §1), but this still lets any path resolve to
    # index.html instead of a bare nginx 404.
    location / {
        try_files $uri /index.html;
    }
}
